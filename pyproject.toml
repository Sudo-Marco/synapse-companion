[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-pet"
version = "0.1.0"
description = "Local, lightweight spiking-neural-network desktop companion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0", "psutil>=5.9",
                "PySide6_Essentials>=6.8", "moderngl>=5.10", "Pillow>=10.0"]

[project.optional-dependencies]
windows = ["pynput>=1.7", "watchdog>=3.0"]
dev = ["pytest>=7.4", "tqdm>=4.66"]

[project.scripts]
synapse-pet = "synapse_pet.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synapse_pet = ["ui/shaders/*.frag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
