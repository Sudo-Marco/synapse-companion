[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-pet"
version = "0.2.0"
description = "Local, lightweight spiking-neural-network desktop companion"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Marco Antônio Veloso Sousa" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0", "psutil>=5.9",
                "PySide6_Essentials>=6.8", "moderngl>=5.10", "Pillow>=10.0"]

[project.optional-dependencies]
windows = ["pynput>=1.7", "watchdog>=3.0"]
audio = ["SoundCard>=0.4.3", "pycaw>=20240210; platform_system == 'Windows'"]
dev = ["pytest>=7.4", "tqdm>=4.66"]

[project.scripts]
synapse-pet = "synapse_pet.main:main"

[project.urls]
Homepage = "https://github.com/Sudo-Marco/synapse-companion"
Repository = "https://github.com/Sudo-Marco/synapse-companion"
Issues = "https://github.com/Sudo-Marco/synapse-companion/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synapse_pet = [
    "ui/shaders/*.frag",
    "assets/pixel/*.png",
    "assets/pixel/*.json",
    "assets/pixel/README.md",
    "assets/fonts/silkscreen/*.ttf",
    "assets/fonts/silkscreen/OFL.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
