seed: 41
renderer: ascii
pet:
  mode: floating          # floating (somente o olho) ou window (painel ao iniciar)
  render_style: pixel     # pixel (Piu), spectral, ascii ou vector
  depth_in_pet_mode: false
  depth:
    enabled: true
    far_fraction: 0.18
    min_scale: 0.42
  spectral:
    glow_strength: 0.82   # 0..1
    rune_count: 10        # 0..12; reduz automaticamente em tamanhos pequenos
    smoke_density: 0.62   # 0..1
  width: 320
  height: 180
  anchor: none             # none, top_left, top_right, bottom_left, bottom_right
  margin: 24
  panel_hotkey: "<ctrl>+<alt>+o"
  start_with_windows: false
pet_motion:
  enabled: true
  interval_min_s: 6.0
  interval_max_s: 12.0
  desktop:
    enabled: true
    speed_px_s: 185
    travel_min_s: 1.0
    travel_max_s: 18.0
    window_geometry_enabled: false
    geometry_poll_ms: 500
    stamina:
      run_cost_per_s: 0.025
      dance_cost_per_s: 0.045
      jump_cost: 0.12
      recovery_per_s: 0.018
      rest_recovery_per_s: 0.12
  behaviors:
    enabled: true
    max_actions_per_hour: 24
    cooldowns_s:
      wander: 4
      think: 18
      rest: 12
      dance: 45
      follow_cursor: 12
      flee_cursor: 18
      window_perch: 30
    actions:
      wander:
        weight: 0.50
        min_stamina: 0.18
        duration_s: 3.0
      think:
        weight: 0.12
        emotions: [curioso]
        duration_s: 4.0
      rest:
        weight: 0.10
        max_stamina: 0.22
        duration_s: 9.0
      dance:
        weight: 0.12
        min_stamina: 0.55
        emotions: [alegre]
        duration_s: 4.0
      follow_cursor:
        weight: 0.08
        emotions: [curioso]
        duration_s: 2.0
      flee_cursor:
        weight: 0.04
        emotions: [estressado]
        duration_s: 2.2
      window_perch:
        weight: 0.04
        min_stamina: 0.2
        requires_window: true
        duration_s: 3.5
  amplitude_px:
    alegre: 26
    curioso: 18
    estressado: 8
    triste: 4
    sonolento: 2
    neutro: 8
teleport:
  enabled: true
  initiative_rate_hz: 1.25
  cooldown_s: 75
  max_per_hour: 4
  quiet_after_interaction_s: 15
  targets: [corners, near_cursor, active_window, center]
visual:
  width: 800
  height: 450
  fps_active: 30
  fps_idle: 5
  max_particles: 48
  ascii_columns: 100
  ascii_rows: 56
  ascii_max_columns: 170
  ascii_max_rows: 96
  palette: cyan_amber_white
  scene_time: auto       # auto, noite, dia ou entardecer
  eye_design: A          # A (íris redonda) ou B (olho alongado)
audio:
  sample_rate: 11025
  block_size: 512
  voice_rms_min: 0.012
  music_rms_min: 0.008
  band_ratio_min: 0.35
  modulation_min: 0.045
  flux_min: 0.035
  voice_sustain_s: 0.65
  voice_release_s: 2.5
  voice_cooldown_s: 8.0
  voice_gestures_per_hour: 24
  dance_min_stamina: 0.35
  dance_sessions_per_hour: 24
  dance_chunk_s: 7.0
  dance_pause_s: 1.0
day_cycle:
  sunrise_hour: 6.0
  sunset_hour: 18.0
  latitude: null       # Opcional; coordenadas manuais, sem localização/rede.
  longitude: null
weather:
  mode: none            # none, rain, fog ou wind; apenas decoração local.
  density: 0.22
context_projections:
  max_contexts: 8
  similarity_threshold: 0.85
network:
  neurons: 600
  sensor_fraction: 0.16
  hidden_fraction: 0.64
  recurrent_connectivity: 0.10
  dt_ms: 2.0
  tick_active_ms: 50
  tick_idle_ms: 250
  background_noise: 0.015
  synaptic_gain: 1.7
  # Experimental lateral competition among tool outputs; disabled to preserve
  # the established dynamics and deterministic reference by default.
  tool_output_inhibition: false
  tool_output_inhibition_strength: 0.35
  # Sample competition every 20 ms instead of every 2 ms LIF substep.
  tool_output_inhibition_interval_steps: 10
  allow_neuron_growth_migration: false
plasticity:
  learning_rate: 0.0005
  eligibility_tau_s: 3.0
  action_credit_rate: 0.10
  dopamine_baseline: 0.0
learning:
  prediction_rate: 0.05
  rpe_deadband: 0.01
  action_preference_rate: 0.30
  neural_score_scale_hz: 15.0
  affect_impulse_tau_s: 4.0
  affect_happiness_gain: 0.10
  curiosity_threshold: 0.72
  curiosity_base: 0.25
  curiosity_inactivity_gain: 0.40
  curiosity_energy_gain: 0.15
personality:
  enabled: true
  initiative_threshold_base: 0.50
  initiative_threshold_strength: 0.08
  caution_threshold_strength: 0.04
  reward_feedback_min_multiplier: 0.85
  reward_feedback_max_multiplier: 1.15
interaction:
  affection_drag_min_s: 1.0
  mouse_observation_interval_s: 0.5
curiosity_novelty:
  impulse_gain_mouse: 0.04
  impulse_gain_active_window: 0.025
  impulse_max: 0.05
  impulse_tau_s: 2.5
  habituation_step: 0.35
  recovery_tau_s: 180.0
  per_minute_cap:
    mouse: 0.08
    active_window: 0.04
affect:
  non_deliberate_mood_per_minute: 0.02
  non_deliberate_impulse_per_minute: 0.08
mood:
  relax_fast_tau_s: 240.0
  relax_slow_tau_s: 1800.0
  slow_component_fraction: 0.20
reward_channels:
  affection:
    affect_impulse: 1.0
    learning_reward: 1.0
  feedback_positive:
    affect_impulse: 0.25
    learning_reward: 1.0
  feedback_negative:
    affect_impulse: -0.35
    learning_reward: -1.0
  proposal_accepted:
    affect_impulse: 0.18
    learning_reward: 0.35
  proposal_rejected:
    affect_impulse: -0.24
    learning_reward: -0.35
  tool_success:
    affect_impulse: 0.08
    learning_reward: 0.10
  tool_failure:
    affect_impulse: -0.20
    learning_reward: -0.20
  curiosity:
    affect_impulse: 0.12
    learning_reward: 0.05
runtime:
  active_timeout_s: 20
  sleep_after_s: 1800
  autosave_s: 60
  proposal_timeout_s: 120
  watchdog_timeout_s: 3
  idle_tick_interval_s: 0.25
  pet_idle_tick_interval_s: 0.4
privacy:
  sensors:
    input_activity: false
    active_window: false
    file_events: false
    clipboard: false
    system_stats: false
    window_geometry: false
    microphone: false
    system_loopback: false
tools:
  max_automatic_per_hour: 6
  failure_cooldown_s: 300
  configuration_notice_cooldown_s: 900
  allowed_folders: []
  allowed_apps: []
  allowed_commands: []
autonomy:
  enabled: true
  max_actions_per_hour: 6
  cooldowns_s:
    alerta: 900
    conversa: 1200
    pausa: 1800
    curiosidade: 1200
    habit_learned: 3600
  state_behaviors:
    estressado: alerta
    atencao: conversa
    entediado: pausa
    curioso: curiosidade
  behaviors:
    postits: true
    habit_notice: true
  postits:
    enabled: true
    max_active: 4
    expires_s: 600
    quick_dismiss_s: 10
    stress_threshold: 0.70
    attention_rate_hz: 1.5
    boredom_threshold: 0.84
    curiosity_threshold: 0.84
    templates:
      alerta: "Parece que o ritmo apertou. Que tal uma pausa para respirar?"
      conversa: "Estou aqui. Quer me contar no que está trabalhando?"
      pausa: "Faz um tempinho de atividade. Uma pausa curta pode ajudar."
      curiosidade: "Notei algo novo por aqui. Quer explorar comigo?"
      habit: "Reconheci um padrão novo no meu aprendizado. Você pode vê-lo na aba Aprendizado."
sleep:
  replay_enabled: false
  # Bounded replay is opt-in; 120 retained high-RPE events improved the
  # one-shot neural retention score in scenario e; 5% slots stay recent.
  max_replay_episodes: 120
  replay_recent_fraction: 0.05
  replay_noise: 0.005
  replay_steps: 2
habits:
  enabled: true
  minimum_observations: 4
  minimum_mean_rpe: 0.015
