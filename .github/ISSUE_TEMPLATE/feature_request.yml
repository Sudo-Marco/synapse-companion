name: Feature request
description: Suggest a bounded, testable improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include controls, defaults, limits, and failure behavior where relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data and privacy
      options:
        - label: I described any new sensor data or local/remote storage.
          required: true
        - label: The proposal does not require capturing typed text or active-window titles.
          required: true
  - type: textarea
    id: validation
    attributes:
      label: How could this be tested?
